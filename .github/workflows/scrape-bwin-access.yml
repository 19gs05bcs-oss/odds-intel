# Bwin access-id kazıyıcı (her 6 saat)
# Not: GITHUB_TOKEN secret yazamaz. Secret güncellemek için:
#      repo secret: GH_TOKENS (classic PAT, scope: repo)
#
# Secrets: BWIN_ACCESS_ID (seed), GH_TOKENS (secret yazmak için)

name: scrape-bwin-access

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-bwin-access
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BWIN_LANG: en
      BWIN_COUNTRY: US
      BWIN_USER_COUNTRY: US
      LOG_LEVEL: INFO
      BWIN_ACCESS_ID: ${{ secrets.BWIN_ACCESS_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Scrape + validate access id
        id: access
        run: |
          set -euo pipefail
          ID="$(odds-intel discover-access-id | tr -d '[:space:]')"
          if [ -z "$ID" ]; then
            echo "::error::access id scrape returned empty"
            exit 1
          fi
          echo "Resolved access id (len=${#ID})"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Update BWIN_ACCESS_ID secret
        env:
          GH_TOKEN: ${{ secrets.GH_TOKENS }}
          NEW_ID: ${{ steps.access.outputs.id }}
          OLD_ID: ${{ secrets.BWIN_ACCESS_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKENS secret yok — secret guncelleme atlandi"
            exit 0
          fi
          if [ -n "${OLD_ID:-}" ] && [ "$NEW_ID" = "$OLD_ID" ]; then
            echo "BWIN_ACCESS_ID already up to date"
            exit 0
          fi
          printf '%s' "$NEW_ID" | gh secret set BWIN_ACCESS_ID --repo "$GITHUB_REPOSITORY"
          echo "BWIN_ACCESS_ID secret updated via GH_TOKENS"
