# Bwin → Supabase poller
# ~5 saat sürekli poll (GHA limit ~6 saat). Cron her 6 saatte bir.
#
# Secrets: SUPABASE_URL, SUPABASE_KEY, BWIN_ACCESS_ID (opsiyonel seed)

name: bwin-poll

on:
  workflow_dispatch:

concurrency:
  group: bwin-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BWIN_LANG: en
      BWIN_COUNTRY: US
      BWIN_USER_COUNTRY: US
      BWIN_SPORT_IDS: "4"
      BWIN_MAX_FIXTURES: "0"
      POLL_INTERVAL_SEC: "60"
      WORKER_MAX_RUNTIME_SEC: "18000"
      LOG_LEVEL: INFO
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      BWIN_ACCESS_ID: ${{ secrets.BWIN_ACCESS_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Resolve working access id
        id: access
        run: |
          set -euo pipefail
          ID="$(odds-intel discover-access-id | tr -d '[:space:]')"
          if [ -z "$ID" ]; then
            echo "::error::access id scrape returned empty"
            exit 1
          fi
          echo "Resolved access id (len=${#ID})"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Probe Bwin fixtures HTTP status
        env:
          BWIN_ACCESS_ID: ${{ steps.access.outputs.id }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/bwin_fixtures.json -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Android 13; Mobile; rv:144.0) Gecko/144.0 Firefox/144.0" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: ${BWIN_LANG}" \
            -H "Referer: https://www.bwin.com/${BWIN_LANG}/sports/football-4" \
            -H "x-bwin-browser-url: https://www.bwin.com/${BWIN_LANG}/sports/football-4" \
            "https://www.bwin.com/cds-api/bettingoffer/fixtures?x-bwin-accessid=${BWIN_ACCESS_ID}&lang=${BWIN_LANG}&country=${BWIN_COUNTRY}&userCountry=${BWIN_USER_COUNTRY}&sportIds=4")
          echo "Bwin fixtures HTTP status: $CODE"
          echo "Runner IP: $(curl -s https://api.ipify.org || true)"
          head -c 400 /tmp/bwin_fixtures.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Bwin fixtures probe failed with HTTP $CODE"
            exit 1
          fi

      - name: Poll ~5h → Supabase
        env:
          BWIN_ACCESS_ID: ${{ steps.access.outputs.id }}
        run: odds-intel worker --max-runtime-sec "${WORKER_MAX_RUNTIME_SEC}"
