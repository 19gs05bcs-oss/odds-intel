# Manual + scheduled Bwin → Supabase poll (tests GitHub Actions IP vs Koyeb 403)
#
# Repo Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_KEY
#   BWIN_ACCESS_ID

name: bwin-poll

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: bwin-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Resolve access id
        id: access
        env:
          BWIN_ACCESS_ID: ${{ secrets.BWIN_ACCESS_ID }}
        run: |
          set -euo pipefail
          if [ -n "${BWIN_ACCESS_ID:-}" ]; then
            echo "Using BWIN_ACCESS_ID secret"
            echo "id=$BWIN_ACCESS_ID" >> "$GITHUB_OUTPUT"
          else
            ID="$(odds-intel discover-access-id)"
            echo "Discovered access id"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Bwin fixtures HTTP status
        env:
          BWIN_ACCESS_ID: ${{ steps.access.outputs.id }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/bwin_fixtures.json -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://www.bwin.com/en/sports/football-4" \
            -H "Origin: https://www.bwin.com" \
            "https://www.bwin.com/cds-api/bettingoffer/fixtures?x-bwin-accessid=${BWIN_ACCESS_ID}&lang=en&country=GB&userCountry=GB&sportIds=4")
          echo "Bwin fixtures HTTP status: $CODE"
          echo "Runner IP: $(curl -s https://api.ipify.org || true)"
          head -c 400 /tmp/bwin_fixtures.json || true
          echo
          if [ "$CODE" = "403" ] || [ "$CODE" = "401" ]; then
            echo "::warning::Bwin blocked this GitHub Actions IP (HTTP $CODE). Same class of problem as Koyeb."
          fi

      - name: Poll once → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BWIN_ACCESS_ID: ${{ steps.access.outputs.id }}
          BWIN_SPORT_IDS: "4"
          BWIN_MAX_FIXTURES: "0"
          LOG_LEVEL: INFO
        run: odds-intel poll-once
