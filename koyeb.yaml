# Deploy as a Worker. Env style matches acoreapi (SUPABASE_URL + SUPABASE_KEY).
name: odds-intel
services:
  - name: bwin-worker
    type: worker
    instance_type: nano
    env:
      - key: SUPABASE_URL
        value: "" # https://xxxx.supabase.co
      - key: SUPABASE_KEY
        value: "" # service_role / secret
      - key: BWIN_ACCESS_ID
        value: ""
      - key: BWIN_FIXTURE_IDS
        value: "" # e.g. 2:7823441,2:7823442
      - key: BWIN_SPORT_IDS
        value: "4"
      - key: BWIN_MAX_FIXTURES
        value: "40"
      - key: POLL_INTERVAL_SEC
        value: "30"
      - key: LOG_LEVEL
        value: INFO
    docker:
      dockerfile: Dockerfile
