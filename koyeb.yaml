# Deploy as a Worker. Env style matches acoreapi (SUPABASE_URL + SUPABASE_KEY).
# Discovers ALL fixtures for BWIN_SPORT_IDS (default football=4).
name: odds-intel
services:
  - name: bwin-worker
    type: worker
    instance_type: nano
    env:
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""
      - key: BWIN_ACCESS_ID
        value: ""
      - key: BWIN_SPORT_IDS
        value: "4"
      - key: BWIN_MAX_FIXTURES
        value: "0"
      - key: BWIN_FIXTURES_PAGE_SIZE
        value: "100"
      - key: POLL_INTERVAL_SEC
        value: "60"
      - key: LOG_LEVEL
        value: INFO
    docker:
      dockerfile: Dockerfile
